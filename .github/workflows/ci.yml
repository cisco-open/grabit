name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
jobs:

  ci:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: 'go.mod'

    - name: Test
      run: make test

    - name: Build
      run: make build
